<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
    <linearGradient id="cupcake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <linearGradient id="frosting" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
    <linearGradient id="cherry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="chocolate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350F" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FBCFE8" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- Cake / Cupcake illustration -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Base Cup -->
    <path d="M 160 270 L 190 400 Q 195 415 210 415 L 302 415 Q 317 415 322 400 L 352 270 Z" fill="url(#chocolate)" />
    <!-- Cup ribs -->
    <path d="M 210 280 L 225 410" stroke="#92400E" stroke-width="3" stroke-linecap="round"/>
    <path d="M 256 280 L 256 415" stroke="#92400E" stroke-width="3" stroke-linecap="round"/>
    <path d="M 302 280 L 287 410" stroke="#92400E" stroke-width="3" stroke-linecap="round"/>

    <!-- Swirled Frosting -->
    <path d="M 135 270 C 135 240 170 230 190 230 C 200 200 240 180 270 185 C 295 190 320 205 325 230 C 350 230 377 245 377 270 C 377 290 355 295 330 295 L 180 295 C 150 295 135 285 135 270 Z" fill="url(#frosting)"/>
    <path d="M 175 235 C 190 195 230 160 275 165 C 310 170 330 200 335 230 Z" fill="#FDF2F8"/>
    <path d="M 215 180 C 230 140 260 130 285 145 C 295 152 300 170 295 185 Z" fill="#FCE7F3"/>

    <!-- Chocolate Drizzle -->
    <path d="M 180 240 Q 200 260 210 235 Q 230 270 250 240 Q 270 275 295 245 Q 315 270 335 245" fill="none" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>

    <!-- Sprinkles -->
    <circle cx="210" cy="205" r="5" fill="#EC4899"/>
    <circle cx="280" cy="210" r="5" fill="#F59E0B"/>
    <circle cx="250" cy="180" r="5" fill="#10B981"/>
    <circle cx="310" cy="235" r="5" fill="#8B5CF6"/>
    <circle cx="180" cy="265" r="5" fill="#3B82F6"/>

    <!-- Cherry on top -->
    <path d="M 270 135 C 275 105 295 85 330 75" fill="none" stroke="#15803D" stroke-width="5" stroke-linecap="round"/>
    <circle cx="265" cy="140" r="28" fill="url(#cherry)"/>
    <ellipse cx="255" cy="130" rx="7" ry="4" fill="#FFFFFF" opacity="0.6" transform="rotate(-30 255 130)"/>
  </g>
</svg>
